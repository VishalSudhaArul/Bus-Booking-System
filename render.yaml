# Render Blueprint for the BusNest API (free web service).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: busnest-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # e.g. https://busnest.vercel.app
      # Vercel and Render are different sites: the refresh cookie must be
      # SameSite=None; Secure to be sent on cross-site requests.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: MONGODB_TRANSACTIONS
        value: auto
